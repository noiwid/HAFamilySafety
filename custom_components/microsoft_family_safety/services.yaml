        entity:
          integration: microsoft_family_safety
    website:
      name: Website
      description: 'The domain to allow (e.g., "example.com"), or a list of domains. Every site is tried; when one fails, the call fails naming the sites done and the sites failed. Asked for a response, it answers the sites done.'
      required: true
      selector:
        text:
          multiple: true

remove_website:
