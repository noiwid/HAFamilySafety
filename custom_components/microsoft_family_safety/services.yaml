        entity:
          integration: microsoft_family_safety
    app_id:
      name: Application ID
      description: The application ID.
      required: true
      selector:
        text:
    app_name:
      name: Application Name
      description: The display name of the application.
      required: true
      selector:
        text:
    platform:
      name: Platform
      description: The platform (windows, xbox, or mobile).
      default: "windows"
      selector:
        select:
          options:
            - "windows"
            - "xbox"
            - "mobile"

block_website:
  name: Block Website
  description: Block a website for a child account.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    website:
      name: Website
      description: 'The domain to block (e.g., "example.com"), or a list of domains. Every site is tried; when one fails, the call fails naming the sites done and the sites failed. Asked for a response, it answers the sites done.'
      required: true
      selector:
