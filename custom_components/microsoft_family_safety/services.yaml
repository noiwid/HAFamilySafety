toggle_web_filter:
  name: Toggle Web Filter
  description: Enable or disable web filtering for a child account.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    enabled:
      name: Enabled
      description: True to enable web filtering, false to disable.
      required: true
      selector:
        boolean:

set_age_rating:
  name: Set Age Rating
  description: Set the content age rating restriction for a child account.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    age:
      name: Age Rating
      description: "Age limit (3-20, or 21 for no restriction)."
      required: true
      selector:
        number:
          min: 3
          max: 21
          step: 1

set_acquisition_policy:
  name: Set Ask-to-Buy Policy
  description: Enable or disable ask-to-buy (purchase approval) for a child account.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    require_approval:
      name: Require Approval
      description: True = require approval for purchases, false = unrestricted.
      required: true
      selector:
        boolean:

lock_account:
  name: Lock Account
  description: Lock a child account by setting all screen time to zero (all 7 days, all intervals). Saves current policy for later restoration.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety

unlock_account:
  name: Unlock Account
  description: Unlock a child account by restoring the screen time policy saved when it was locked. Refuses when no saved policy exists, so a real schedule is never replaced by a default one.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety

request_reauth:
  name: Request Reauthentication
  description: Start the Microsoft sign-in flow now, for example from a dashboard button, instead of waiting for the integration to detect an expired session.

get_sites:
  name: Get Sites
  description: "Return the child's blocked and allowed websites exactly as Microsoft stores them (absolute URLs), and whether the web filter is on. Call it with a response variable."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety

pause_app:
  name: Pause App
  description: "Block Windows or Xbox apps of a child for now. Each app's policy (its daily time limit, or none) is read from Microsoft and saved before its first pause, and kept while it is blocked; resume_app puts it back. Apps already blocked, or whose policy cannot be read, are not paused. A repeat pause keeps the first saved state, also after a restart; an app whose limit a parent changed since is left as it is. Answers with the apps paused, changed by a parent, skipped and failed; fails when every app failed."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    apps:
      name: Apps
      description: "App IDs as the Applications sensor lists them (x:... for Xbox, appx:... or win32:... for Windows)."
      required: true
      selector:
        text:
          multiple: true

resume_app:
  name: Resume App
  description: "Unblock apps pause_app blocked, putting back the time limit each had before (or none), and forget their saved state. Without apps, every paused app of the child. An app someone unblocked or changed in the meantime is left as it is. Answers with the apps resumed, released, changed by a parent, skipped and failed; fails when every app failed."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    apps:
      name: Apps
      description: App IDs to resume; leave empty for every paused app of the child.
      required: false
      selector:
        text:
          multiple: true
