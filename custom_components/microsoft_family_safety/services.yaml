        boolean:

lock_account:
  name: Lock Account
  description: Lock a child account by setting all screen time to zero (all 7 days, all intervals). Saves current policy for later restoration.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety

unlock_account:
  name: Unlock Account
  description: Unlock a child account by restoring the screen time policy saved when it was locked. Refuses when no saved policy exists, so a real schedule is never replaced by a default one.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety

request_reauth:
  name: Request Reauthentication
  description: Start the Microsoft sign-in flow now, for example from a dashboard button, instead of waiting for the integration to detect an expired session.

get_sites:
  name: Get Sites
  description: "Return the child's blocked and allowed websites exactly as Microsoft stores them (absolute URLs), and whether the web filter is on. Call it with a response variable."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
