      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    enabled:
      name: Enabled
      description: True to enable web filtering, false to disable.
      required: true
      selector:
        boolean:

set_age_rating:
  name: Set Age Rating
  description: Set the content age rating restriction for a child account.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    age:
      name: Age Rating
      description: "Age limit (3-20, or 21 for no restriction)."
      required: true
      selector:
        number:
          min: 3
          max: 21
