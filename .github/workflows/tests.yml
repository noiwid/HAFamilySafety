name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  home-assistant-current:
    name: Home Assistant 2026.9.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test-homeassistant.txt
      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test-homeassistant.txt
      - name: Run integration tests
        run: >-
          python -m pytest --disable-socket --allow-unix-socket
          tests/custom_components/microsoft_family_safety
